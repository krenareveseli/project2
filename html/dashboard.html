<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard-MiniLibraryAI </title>
 <link rel="stylesheet" href="../css/dashboard.css">
 <link rel="icon" type="image/x-icon" href="../images/LOGO.png">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">MiniLibraryAI</h2>

    <nav>
      <a href="dashboard.html" target="_parent">📊 Dashboard</a>
      <a href="library.html" target="_parent">📚 Library</a>
      <a href="aitour.html" target="_parent">🧠 AI Tutor</a>
      <a href="setting.html" target="_parent">⚙️ Settings</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">
      <h1>Dashboard</h1>
      <button class="btn">Upgrade</button>
    </header>

    <!-- CARDS -->
    <section class="cards">

      <div class="card">
        <h3>📚 Subjects</h3>
        <p>12 active courses</p>
      </div>

      <div class="card">
        <h3>🧠 AI Sessions</h3>
        <p>5 sessions today</p>
      </div>

      <div class="card">
        <h3>📈 Progress</h3>
        <p>56%</p>
      </div>

    </section>

    <!-- PROGRESS BOX -->
    <section class="progress-box">
      <h2>Weekly Progress</h2>
      <div class="progress-bar">
        <div class="fill"></div>
      </div>
    </section>

  </main>

</div>

</body>
</html>
