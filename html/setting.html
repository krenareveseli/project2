<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings-MiniLibraryAI</title>
  <link rel="stylesheet" href="../css/settings.css">
  <link rel="icon" type="image/x-icon" href="../images/LOGO.png">
</head>
<body>

  <div class="container">

    <header class="header">
      <h1>⚙️ Settings</h1>
      <p>Manage your study dashboard preferences</p>
    </header>

    <div class="grid">

      <!-- PROFILE -->
      <div class="card">
        <h2>👤 Profile</h2>
        <input type="text" placeholder="Your name">
        <input type="email" placeholder="Email">
        <button>Save Profile</button>
      </div>

      <!-- THEME -->
      <div class="card">
        <h2>🎨 Theme</h2>

        <label class="toggle">
          <input type="checkbox">
          <span>Dark Mode</span>
        </label>

        <label class="toggle">
          <input type="checkbox">
          <span>Blue Accent</span>
        </label>

        <label class="toggle">
          <input type="checkbox">
          <span>Reduce Animations</span>
        </label>

      </div>

      <!-- NOTIFICATIONS -->
      <div class="card">
        <h2>🔔 Notifications</h2>

        <label class="toggle">
          <input type="checkbox">
          <span>Daily reminders</span>
        </label>

        <label class="toggle">
          <input type="checkbox">
          <span>Study alerts</span>
        </label>

        <label class="toggle">
          <input type="checkbox">
          <span>Email updates</span>
        </label>

      </div>

      <!-- DATA -->
      <div class="card">
        <h2>💾 Data</h2>
        <button class="danger">Clear Notes</button>
        <button>Export Data</button>
      </div>

    </div>

  </div>

</body>
</html>
