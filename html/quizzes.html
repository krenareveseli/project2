<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz - MiniLibraryAI</title>
<link rel="stylesheet" href="../css/quizzes.css">
<link rel="icon" type="image/x-icon" href="../images/LOGO.png">
</head>

<body>

<div class="container">

  <header class="top">
    <h1>🧠 Biology Quiz</h1>
    <p>Test your knowledge</p>
  </header>

  <div class="quiz">

    <!-- QUESTION -->
    <div class="question">
      <h2>1. What is the powerhouse of the cell?</h2>

      <div class="options">
        <button>A. Nucleus</button>
        <button>B. Mitochondria</button>
        <button>C. Ribosome</button>
        <button>D. Cytoplasm</button>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="question">
      <h2>2. H2O is?</h2>

      <div class="options">
        <button>A. Oxygen</button>
        <button>B. Hydrogen</button>
        <button>C. Water</button>
        <button>D. Acid</button>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="question">
      <h2>3. DNA stands for?</h2>

      <div class="options">
        <button>A. Deoxyribonucleic Acid</button>
        <button>B. Data Network Array</button>
        <button>C. Digital Native Access</button>
        <button>D. None</button>
      </div>
    </div>

    <button class="submit">Submit Quiz</button>

  </div>

</div>

</body>
</html>
