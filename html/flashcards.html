<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards - MiniLibraryAI</title>
<link rel="stylesheet" href="../css/flash.css">
<link rel="icon" type="image/x-icon" href="../images/LOGO.png">
</head>

<body>

<div class="container">

  <h1>Flashcards</h1>

  <div class="grid">

    <!-- CARD 1 -->
    <div class="flashcard">
      <div class="inner">
        <div class="front">
          <h2>What is photosynthesis?</h2>
        </div>
        <div class="back">
          <p>Process where plants convert sunlight into energy.</p>
        </div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="flashcard">
      <div class="inner">
        <div class="front">
          <h2>H2O means?</h2>
        </div>
        <div class="back">
          <p>Water molecule (Hydrogen + Oxygen)</p>
        </div>
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="flashcard">
      <div class="inner">
        <div class="front">
          <h2>Newton’s 2nd Law?</h2>
        </div>
        <div class="back">
          <p>F = m × a</p>
        </div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
