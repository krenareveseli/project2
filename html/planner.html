<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner - MiniLibraryAI</title>
 <link rel="stylesheet" href="../css/planner.css">
 <link rel="icon" type="image/x-icon" href="../images/LOGO.png">
</head>

<body>

<div class="container">

  <header class="top">
    <h1>📅 Study Planner</h1>
    <button class="btn">+ New Task</button>
  </header>

  <div class="planner">

    <!-- LEFT: TASK LIST -->
    <div class="tasks">

      <div class="task done">
        <h3>Biology - Chapter 2</h3>
        <p>Finish notes + exercises</p>
        <span>Completed</span>
      </div>

      <div class="task">
        <h3>Chemistry Revision</h3>
        <p>Atoms + reactions practice</p>
        <span>In progress</span>
      </div>

      <div class="task">
        <h3>Math Exercises</h3>
        <p>Algebra + derivatives</p>
        <span>Pending</span>
      </div>

    </div>

    <!-- RIGHT: CALENDAR STYLE -->
    <div class="calendar">

      <h2>This Week</h2>

      <div class="day">Monday - Study Biology</div>
      <div class="day">Tuesday - Chemistry</div>
      <div class="day">Wednesday - Math</div>
      <div class="day">Thursday - Practice Tests</div>
      <div class="day">Friday - Revision</div>

    </div>

  </div>

</div>

</body>
</html>
